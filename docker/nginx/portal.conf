# Example Nginx server block. Use it for a sub-domain such as
# tags.example.com, or inline it as a location block for a sub-directory.

server {
    listen 443 ssl http2;
    server_name tags.example.com;

    root /var/www/portal;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/tags.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tags.example.com/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Any valid public ID is served by the tag page controller.
    location ~ ^/t/([A-Za-z0-9]{4,12})/?$ {
        try_files $uri /t/index.php?id=$1;
    }

    # Never expose configuration, includes, scripts, tests or logs.
    location ~ ^/(config|includes|scripts|tests|logs)/ {
        deny all;
        return 404;
    }

    location ~ /\.(env|git) {
        deny all;
        return 404;
    }

    # Uploaded photos are static, but must not be executed.
    location ^~ /storage/uploads/ {
        location ~ \.php$ { deny all; }
        add_header X-Content-Type-Options nosniff;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
